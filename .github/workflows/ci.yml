name: Webapp build

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.13]

    steps:
      # Vérification du dépôt
      - name: Checkout repository
        uses: actions/checkout@v3

      # Configuration de Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Installation des dépendances avec npm clean-install
      - name: Install dependencies
        run: npm clean-install

      # Audit de sécurité
      - name: Audit
        run: npm audit --audit-level=high

      # Vérification de la signature des audits
      - name: Audit Signature
        run: npm audit signatures --audit-level=high

      # Linter2
      - name: Lint
        run: npm run lint

      #Set environment variables quote
      - name: Create environment file
        run: |
          mkdir src/environments
          echo "Creating environment.ts file ..."
          echo "${{ secrets.FIREBASE_CONFIG2 }}"  >> src/environments/environment.ts
      
      #Check if src/environments/envenvironment.ts exist
      - name: Check if env exist
        run: |
          if test -f "src/environments/environment.ts"; then
               echo "environment.ts file exist ..."
               cat src/environments/environment.ts
          fi
      
      #Tests    
      - name: Test
        run: npm run test

      # Build2
      - name: Build
        run: npm run build