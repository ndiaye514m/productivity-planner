<div class="container text-center mt-1">
  <div class="row">
    @for (feature of featureCardList(); track feature.name) {
      <div class="col-md-4">
        <div class="card" data-testid="feature-card">
          <div class="card-header" data-testid="feature-card-title">
            <h4 style="font-weight: bold">{{ feature.name }}</h4>
          </div>
          <div class="card-body mx-auto">
            <!-- <i class="bi bi-star-fill h1"></i>-->
            <i
              class="bi text-warning"
              [ngClass]="'bi-' + feature.icon"
              style="font-weight: bold; font-size: 90px"
            ></i>
            <p class="card-title">{{ feature.description }}</p>
            <!--<p class="card-text">{{ feature.description }}</p>-->
          </div>
        </div>
      </div>
    }
  </div>
</div>
