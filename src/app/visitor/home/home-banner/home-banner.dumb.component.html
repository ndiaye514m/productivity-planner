<div
  class="text-center bg-image bg-body-tertiary"
  style="
    background-image: url(&quot;/images/perso4.png&quot;);
    height: 600px;
    background-size: cover;
    align: center;
    background-position: 90% 10%;
  "
>
  <!--<div class="text-center bg-image bg-body-tertiary" style="
    background-image: url('/images/bannertable1200.webp');
    height: 500px;
    background-size:cover;
    align:center">-->
  <div
    class="mask"
    style="
      background-color: rgba(0, 0, 0, 0.6);
      height: 600px;
      background-size: cover;
    "
  >
    <div class="container py-5">
      <h1
        data-testid="banner-title"
        class="text-light"
        style="margin-top: 130px"
      >
        {{ title() }}
      </h1>
      <div class="col-lg-8 mx-auto lead">
        <p class="text-white" data-testid="banner-description">
          {{ description() }}
        </p>
        <button
          data-testid="banner-buttonLabel"
          type="button"
          class="btn btn-lg btn-primary moncustom-btn"
          (click)="clicked.emit()"
        >
          {{ buttonLabel() }}
        </button>
      </div>
    </div>
  </div>
</div>
