                <input #nameField type="text" [value]="name()" (input)="name.set(nameField.value)" />                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         
               
                <!--<div *ngIf="productName!= null">-->

                    <div *ngIf="submitted && productFormGroup.controls.['name'].errors.required" class="invalid-feedback">
                      Le Nom est requis
                    </div>
                  </div>-->
                
            </div>
              <div class="col-auto">

                        </span>
                        
                       
                       
            </div>
        </div>
    
         <div class="row mb-5 form-group">
            <label for="inputPrice" class="col-sm-1 col-form-label text-center ms-5">E-mail : </label>
            <div class="col-sm-4 position-relative"><!--position relative pour tooltip-->
              <!--  <input type="number" class="form-control" formControlName="price" [ngClass]="{'is-valid':submitted && productPrice.valid,'is-invalid':submitted && productPrice.invalid}">-->
              <input #emailField type="text" [value]="email()" (input)="email.set(emailField.value)" />

                 <div *if="submitted && productPrice.invalid" class="invalid-tooltip">Champ obligatoire</div>-->
                 <div class="valid-tooltip" >Champ Valide</div>

             -->

            -->

                <input #passwordField type="password" [value]="password()" (input)="password.set(passwordField.value)" />

                 <div *if="submitted && productQuantity.invalid" class="invalid-tooltip">Champ obligatoire</div>-->

                 <div class="invalid-tooltip">Champ obligatoire</div>

                    <span id="QuantityHelpInline" class="form-text">
                          
                        </span>
            </div>
       
        </div>


        <div class="row mb-4">
            <label for="inputSelected" class="col-sm-1 col-form-label text-center ms-5">Selected : </label>
            <div class="col-sm-2 mt-1">
                
              <input #confirmedPasswordField type="password" [value]="confirmedPassword()" (input)="confirmedPassword.set(confirmedPasswordField.value)" />
                                      
            </div>
               
        <div class="col-auto">
                    <span id="selectedHelpInline" class="form-text">
                          
                        </span>
            </div>
       
        </div>
        

        <div class="row mb-5">
            <label for="inputAvailable" class="col-sm-1 col-form-label text-center ms-5">Available : </label>
      
            <div class="col-sm-2 mt-2">
            <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckChecked" formControlName="available" checked>
                    <label class="form-text" for="flexSwitchCheckChecked">activé si disponible</label>

                  </div>
                </div>

                    <span id="availableHelpInline" class="form-text">

        <div class="row offset-sm-2">
            <div class="col-auto">
                <button type="submit" class="btn btn-success" (click)="onSaveProduct()">Enregistrer</button>
            </div>
            <div class="col-auto">
